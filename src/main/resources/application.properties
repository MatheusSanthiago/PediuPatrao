spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pizzaria?replicaSet=rs0}
spring.data.mongodb.database=${MONGODB_DATABASE:pizzaria}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
server.error.include-message=never
server.error.include-stacktrace=never
