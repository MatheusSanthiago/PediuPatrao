# Configurando a conexao com MongoDB enquanto repositorio de dados
spring.data.mongodb.uri=mongodb://localhost:27017/pizzaria
spring.data.mongodb.database=pizzaria

# Definindo usuario e senha padrao para autenticacao de usuario do sistema
#spring.main.allow-circular-references=true
spring.security.user.name=user
spring.security.user.password=shalom

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG