<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>
<div th:fragment="sidebar">
    <div id="sidebar">
        <h4 class="text-center py-3">Pediu Patrão</h4>
        <p class="text-center mb-1" th:text="${usuarioLogado}"></p>
        <p class="text-center small" th:text="${'Perfil: ' + perfilLogado}"></p>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" th:href="@{/}"><i class="bi bi-house"></i> Home</a></li>
            <li class="nav-item" th:if="${admin or gerente}"><a class="nav-link" th:href="@{/admin}"><i class="bi bi-bar-chart"></i> Dashboard</a></li>
            <li class="nav-item">
                <a th:if="${gerente or atendente}" class="nav-link" th:href="@{/clientes}"><i class="bi bi-person-raised-hand"></i> Clientes</a>
                <span th:unless="${gerente or atendente}" class="nav-link opcao-restrita" title="Consulta disponível para GERENTE e ATENDENTE"><i class="bi bi-lock"></i> Clientes <small>restrito</small></span>
            </li>
            <li class="nav-item"><a class="nav-link" th:href="@{/pedidos}"><i class="bi bi-bag"></i> Pedidos</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/entregas}"><i class="bi bi-truck"></i> Entregas</a></li>
            <li class="nav-item" th:classappend="${configuracoesAberta} ? 'open'">
                <button type="button" class="nav-link w-100 text-start border-0 bg-transparent" aria-controls="submenu-configuracoes" th:attr="aria-expanded=${configuracoesAberta}" onclick="toggleSubmenu(event, this)">
                    <i class="bi bi-gear"></i> Configurações <span class="float-end" aria-hidden="true">&#9662;</span>
                </button>
                <ul id="submenu-configuracoes" class="nav flex-column submenu">
                    <li class="nav-item"><a class="nav-link" th:href="@{/configuracoes}">Visão geral</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/funcionarios}"><i class="bi bi-person-walking"></i> Funcionários</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/entregadores}"><i class="bi bi-bicycle"></i> Entregadores</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/horarios}"><i class="bi bi-clock"></i> Horário de Funcionamento</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/produtos}"><i class="bi bi-boxes"></i> Produtos</a></li>
                    <li class="nav-item">
                        <a th:if="${admin}" class="nav-link" th:href="@{/usuarios}"><i class="bi bi-people-fill"></i> Usuários</a>
                        <span th:unless="${admin}" class="nav-link opcao-restrita" title="Administração de usuários exclusiva do ADMIN"><i class="bi bi-lock"></i> Usuários <small>ADMIN</small></span>
                    </li>
                </ul>
            </li>
            <li class="nav-item">
                <a th:if="${admin or gerente}" class="nav-link" th:href="@{/auditoria}"><i class="bi bi-clock-history"></i> Auditoria</a>
                <span th:unless="${admin or gerente}" class="nav-link opcao-restrita" title="Consulta exclusiva de ADMIN e GERENTE"><i class="bi bi-lock"></i> Auditoria <small>restrito</small></span>
            </li>
            <li class="nav-item"><form th:action="@{/logout}" method="post"><button type="submit" class="nav-link border-0 bg-transparent">Sair</button></form></li>
        </ul>
    </div>
</div>
</body>
</html>
