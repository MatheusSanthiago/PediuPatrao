<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Clientes</h2><a th:if="${atendente}" th:href="@{/clientes/novo}" class="btn btn-primary">Novo cliente</a>
    </div>
    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="table-responsive card">
        <table class="table table-hover mb-0">
            <thead><tr><th>Nome e identificador</th><th>Telefone</th><th>Endereço</th><th>Ações</th></tr></thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(clientes)}"><td colspan="4">Nenhum cliente cadastrado.</td></tr>
                <tr th:each="cliente : ${clientes}">
                    <td><span th:text="${cliente.nome}"></span><small class="d-block text-muted" th:text="${cliente.id}"></small></td>
                    <td th:text="${cliente.telefone}"></td>
                    <td>
                        <span th:text="${cliente.logradouro ?: cliente.endereco}"></span> <span th:text="${cliente.numero}"></span>
                        <span th:text="${cliente.complemento}"></span> <span th:text="${cliente.bairro}"></span>
                        <span th:text="${cliente.cidade}"></span> <span th:text="${cliente.estado}"></span>
                    </td>
                    <td>
                        <div th:if="${atendente}" class="d-flex gap-2">
                            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                            <form th:action="@{/clientes/deletar/{id}(id=${cliente.id})}" method="post" onsubmit="return confirm('Excluir este cliente?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                            </form>
                        </div>
                        <span th:if="${gerente}" class="text-muted">Somente consulta</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
