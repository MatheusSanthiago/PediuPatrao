<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>
<div th:fragment="content" class="formulario-medio">
    <h2 th:text="${funcionario.id == null ? 'Novo funcionário' : 'Editar funcionário'}"></h2>
    <div th:if="${erro}" th:text="${erro}" class="alert alert-danger" role="alert"></div>
    <form th:action="@{/funcionarios/salvar}" th:object="${funcionario}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input id="nome" th:field="*{nome}" maxlength="120" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="telefone" class="form-label">Telefone com DDD</label>
            <input id="telefone" th:field="*{telefone}" type="tel" maxlength="20" placeholder="(11) 99999-9999" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="cargo" class="form-label">Cargo</label>
            <input id="cargo" th:field="*{cargo}" maxlength="80" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="ativo" class="form-label">Situação</label>
            <select id="ativo" th:field="*{ativo}" class="form-select">
                <option value="true">Ativo</option>
                <option value="false">Inativo</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/funcionarios}" class="btn btn-outline-secondary">Voltar</a>
    </form>
</div>
</body>
</html>
