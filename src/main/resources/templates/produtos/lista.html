<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Produtos</h2><a th:if="${admin or gerente}" th:href="@{/produtos/novo}" class="btn btn-primary">Novo produto</a>
    </div>
    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="table-responsive card">
        <table class="table mb-0">
            <thead><tr><th>Nome</th><th>Tipo</th><th>Preço</th><th>Ativo</th><th>Ações</th></tr></thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(produtos)}"><td colspan="5">Nenhum produto cadastrado.</td></tr>
                <tr th:each="produto : ${produtos}">
                    <td th:text="${produto.nome}"></td><td th:text="${produto.tipo}"></td>
                    <td th:text="${'R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:text="${produto.ativo == true ? 'Sim' : 'Não'}"></td>
                    <td><div th:if="${admin or gerente}" class="d-flex gap-2">
                        <a th:href="@{/produtos/editar/{id}(id=${produto.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                        <form th:action="@{/produtos/deletar/{id}(id=${produto.id})}" method="post" onsubmit="return confirm('Excluir o produto? Os itens dos pedidos anteriores serão preservados.')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                        </form>
                    </div></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
