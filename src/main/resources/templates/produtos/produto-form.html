<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>
<div th:fragment="content">
    <h2 th:text="${produto.id == null ? 'Novo produto' : 'Editar produto'}"></h2>
    <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post" class="card card-body formulario-medio">
        <input type="hidden" th:field="*{id}">
        <label for="nome" class="form-label">Nome</label>
        <input id="nome" th:field="*{nome}" class="form-control mb-3" maxlength="120" required>
        <label for="tipo" class="form-label">Tipo</label>
        <input id="tipo" th:field="*{tipo}" class="form-control mb-3" placeholder="Pizza, bebida, lanche..." required>
        <label for="preco" class="form-label">Preço</label>
        <input type="number" id="preco" th:field="*{preco}" min="0.01" max="100000" step="0.01" class="form-control mb-3" required>
        <label class="form-check-label mb-3"><input type="checkbox" th:field="*{ativo}" class="form-check-input"> Ativo</label>
        <div><button type="submit" class="btn btn-primary">Salvar</button> <a th:href="@{/produtos}" class="btn btn-outline-secondary">Voltar</a></div>
    </form>
</div>
</body>
</html>
